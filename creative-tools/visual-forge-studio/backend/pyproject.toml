[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-forge"
version = "0.1.0"
description = "Batch-oriented visual production automation for logos and product images"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.4,<13",
]

[project.scripts]
visualforge = "visualforge.cli:main"

[tool.setuptools.packages.find]
include = ["visualforge*"]

[tool.setuptools.package-data]
visualforge = ["web/*"]

