services:
  dashboard:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DASHBOARD_HOST: "0.0.0.0"
      DASHBOARD_PORT: "8080"
      DASHBOARD_DATA_DIR: "/app/data"
      DASHBOARD_ADMIN_USER: "${DASHBOARD_ADMIN_USER:-admin}"
      DASHBOARD_ADMIN_PASSWORD: "${DASHBOARD_ADMIN_PASSWORD:-admin123}"
      DASHBOARD_TOKEN_SECRET: "${DASHBOARD_TOKEN_SECRET:-change-me-to-a-long-random-secret}"
    volumes:
      - ./data:/app/data
